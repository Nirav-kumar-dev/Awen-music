name: Build TideFlow APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup FFTW for Android
        uses: ./.github/actions/setup-fftw

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Arm64 Foss APK
        run: ./gradlew :app:assembleArm64FossDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TideFlow-Arm64-Debug-APK
          path: app/build/outputs/apk/arm64Foss/debug/*.apk
